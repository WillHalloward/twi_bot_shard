name: Security Scanning

on:
  push:
    branches: [ staging, production ]
  pull_request:
    branches: [ staging, production ]
  schedule:
    - cron: '0 0 * * 0'  # Run weekly on Sunday at midnight

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    # Advisory: pip-audit exits non-zero on any known advisory (including
    # transitive ones we can't immediately patch). Report via artifact without
    # failing the workflow; flip off once findings are triaged to zero.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit
        # Advisory: don't fail the check on known advisories; report via artifact.
        # `--desc on` must take an explicit value — `--desc .` makes argparse
        # consume the project path as the flag's value and abort with exit 2,
        # so the scan never runs. Pass the project path positionally instead.
        continue-on-error: true
        run: pip-audit --desc on -f json -o pip-audit-report.json .

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  static-analysis:
    name: Static Security Analysis
    runs-on: ubuntu-latest
    # Advisory: bandit exits non-zero on any finding. Report via artifact
    # without failing the workflow.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit
        # Advisory: bandit exits non-zero on any finding; report via artifact
        # without failing the check.
        continue-on-error: true
        # Exclude tests and the virtualenv (.venv, not ./venv — the old path
        # never matched, so bandit scanned third-party code in .venv).
        run: bandit -r . -x ./tests,./.venv -f json -o bandit-report.json

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    # Hard gate: secret detection should block. Currently passing (no secrets
    # in history).
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so gitleaks can scan all commits; a shallow clone
          # makes git emit to stderr and gitleaks errors with
          # "failed to scan Git repository error=stderr is not empty".
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
