name: CI

on:
  push:
    branches: [ staging, production ]
  pull_request:
    branches: [ staging, production ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: testing  # required: enables test config / lazy cog loading

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Install dependencies
      run: uv pip install --system -e ".[dev]"

    - name: Provide test environment config
      # config/__init__.py validates required env vars at import time. Locally
      # these come from a developer's .env; in CI use the committed dummy
      # values in .env.test (tests use SQLite/mocks, not a real database).
      run: cp .env.test .env

    - name: Run tests
      run: python -m pytest tests/ --cov=. --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    # Hard gate: `ruff check .`, `ruff format --check .`, and `mypy .` are all
    # clean, so any new lint/format/type regression fails the build. If a large
    # backlog ever returns and you need to unblock merges temporarily, add
    # `continue-on-error: true` to the offending *step* (not the job — job-level
    # only spares the overall run while the named check still reports red).

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Install dependencies
      run: uv pip install --system -e ".[dev]"

    - name: Run ruff check
      run: ruff check .

    - name: Run ruff format check
      run: ruff format --check .

    - name: Run mypy
      run: mypy .

  build:
    runs-on: ubuntu-latest
    # Non-blocking: the bot deploys via Railway, not as a published package, so
    # the build is a sanity check rather than a release gate.
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Build package
      run: uv build

    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
