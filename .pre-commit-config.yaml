# Pre-commit hooks configuration
# See https://pre-commit.com for more information
#
# Rev pins are kept in sync with the project's actual tool versions
# (requirements.txt / .venv): ruff 0.15.15. mypy runs as a local hook from
# the project venv (mypy 2.1.0), so it tracks requirements.txt automatically.

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
    -   id: check-toml
    -   id: debug-statements

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
    -   id: ruff
        args: [--fix, --exit-non-zero-on-fix]
    -   id: ruff-format

# mypy runs from the project venv (language: system) so the hook sees the
# same dependencies and mypy.ini excludes as the CI gate (`mypy .`).
# The isolated mirrors-mypy env produces spurious errors (no project deps,
# and pre-commit's explicit filenames bypass mypy.ini's exclude).
-   repo: local
    hooks:
    -   id: mypy
        name: mypy
        entry: .venv/bin/mypy .
        language: system
        types: [python]
        pass_filenames: false

# Shift-left secret scanning: gitleaks is a hard gate in CI
# (.github/workflows/security-scan.yml); this hook catches secrets
# BEFORE they are committed/pushed.
-   repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
    -   id: gitleaks
